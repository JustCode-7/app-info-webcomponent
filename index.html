<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Component Testumgebung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /*
          Hier simulieren wir das Design der Host-Webseite.
          Unsere Web Component wird hiervon dank Shadow DOM NICHT beeinflusst.
        */
        body {
            font-family: 'Times New Roman', serif; /* Absichtlich altbacken */
            padding: 40px;
        }
        h1 {
            color: #cc0000;
        }
    </style>
</head>
<body class="bg-dark text-light">

<!-- 1. Bereich der normalen Host-Webseite -->
<h1 class="border rounded border-red-2">Willkommen auf der Host-Webseite</h1>
<p>Dieser Text und das Design gehören der übergeordneten Webseite.</p>
<hr>

<!-- 2. Hier binden wir deine hochkomplexe Web Component ein -->
<!-- Du nutzt einfach das in der main.ts registrierte HTML-Tag -->
<my-webcomponent msg="info from integrating App e.g. app-version"></my-webcomponent>
<hr>
<p>Hier endet die Host-Webseite wieder.</p>

<!-- 3. Der Einstiegspunkt für Vite während der Entwicklung -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
